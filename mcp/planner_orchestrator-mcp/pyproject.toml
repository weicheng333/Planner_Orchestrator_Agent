[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "planner-orchestrator-agent"
version = "1.0.0"
description = "面向 Codex 的最小充分执行 DAG 规划与协调 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0,<3.0",
  "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
  "pyyaml>=6.0,<7.0",
  "pytest>=8.0,<9.0",
]

[project.scripts]
planner-orchestrator-agent = "planner_orchestrator_agent.__main__:main"
planner-orchestrator-mcp = "planner_orchestrator_agent.mcp_server.server:main"
planner-orchestrator-export-schemas = "planner_orchestrator_agent.contracts.export_schemas:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
